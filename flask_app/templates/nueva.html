<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Entrada - QueridoDiario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-4">
        <!-- Navegación superior -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 fw-bold m-0">Nueva Entrada</h2>
            <div>
                <a href="/dashboard" class="link-inicio">Inicio</a>
                <a href="/logout" class="link-logout">Cerrar Sesión</a>
            </div>
        </header>

        <div style="max-width: 500px;">
            <!-- Muestra de errores si la validación falla (ej. fecha vacía) -->
            {% with messages = get_flashed_messages(category_filter=["entrada"]) %}
                {% if messages %}
                    {% for msg in messages %}
                        <p class="text-danger small mb-2">{{ msg }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Formulario de creación de nota -->
            <form action="/crear_entrada" method="POST">
                <div class="mb-3 row align-items-center">
                    <label for="fecha" class="col-sm-4 col-form-label fw-semibold">Fecha Entrada:</label>
                    <div class="col-sm-8">
                        <input type="date" class="form-control" id="fecha" name="fecha" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="notas" class="form-label fw-semibold">Notas:</label>
                    <textarea class="form-control" id="notas" name="notas" rows="6" required></textarea>
                </div>

                <button type="submit" class="btn btn-guardar">Guardar</button>
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Entrada - QueridoDiario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-4">
        <!-- Encabezado de la vista individual -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 fw-bold m-0">Ver Entrada</h2>
            <div>
                <a href="/dashboard" class="link-inicio">Inicio</a>
                <a href="/logout" class="link-logout">Cerrar Sesión</a>
            </div>
        </header>

        <!-- Tarjeta de detalle de la nota seleccionada -->
        <div class="custom-card p-4" style="max-width: 600px;">
            <h3 class="h4 fw-bold mb-4">Entrada de {{ entrada.fecha.strftime('%Y-%m-%d') }}</h3>
            <!-- El filtro white-space respeta los saltos de línea del usuario -->
            <p class="fs-6 m-0" style="white-space: pre-wrap;">{{ entrada.notas }}</p>
        </div>
    </div>
</body>
</html>
